[project]
name = "py-agent-audit"
version = "0.4.0"
description = "A small python app to audit your coding agents log files for the most often used reoccurring tasks, in order to integrate tools for them to reduce your token usage in the future."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0.0",
    "pyside6>=6.12.0",
]

[project.scripts]
py-agent-audit = "src.main:main"
main = "src.main:main"
py-agent-audit-server = "src.server:main"
test = "pytest:main"
build = "src.build:main"
format = "src.tools:format_code"
lint = "src.tools:lint_code"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
